name: Universal Web Intelligence v2 Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-intelligence-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP: https://wae-inteligencia-universal-vt3h.onrender.com
    steps:
      - name: Wait for v2 production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if HEALTH=$(curl -fsS --max-time 20 "$APP/api/web/health"); then
              if jq -e '.success == true and .version == "universal-web-intelligence/v2.0.0" and .security.direct.httpsOnly == true and .security.direct.robotsAware == true' <<<"$HEALTH" >/dev/null; then
                jq '{version,status,security,specialists,persistence}' <<<"$HEALTH"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Universal Web Intelligence v2 did not become ready"
          exit 1

      - name: Verify direct retrieval on stable public documentation
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n '{url:"https://www.rfc-editor.org/rfc/rfc9110.html",query:"HTTP semantics",persist:false}')
          RESULT=$(curl -fsS --max-time 45 "$APP/api/web/retrieve"             -H 'content-type: application/json'             --data-binary @- <<<"$PAYLOAD")
          jq -e '.success == true' <<<"$RESULT" >/dev/null
          jq -e '.item.document.kind == "html"' <<<"$RESULT" >/dev/null
          jq -e '(.item.document.contentHash // "") | length == 64' <<<"$RESULT" >/dev/null
          jq -e '(.citation.url // "") | startswith("https://")' <<<"$RESULT" >/dev/null
          jq -e '(.citation.excerpt // "") | length > 40' <<<"$RESULT" >/dev/null
          jq '{version:.version,url:.citation.url,title:.citation.title,kind:.item.document.kind,hash:.item.document.contentHash,robots:.item.document.robots,status:.item.directRetrieval}' <<<"$RESULT"
