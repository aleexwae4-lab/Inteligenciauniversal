name: Mobile Production v27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_URL: https://wae-inteligencia-universal.onrender.com
      MOBILE_UA: Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 Chrome/152.0.0.0 Mobile Safari/537.36
    steps:
      - name: Wait for v27 capability kernel on Render
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 54); do
            MOBILE=$(curl -fsS --max-time 25 -A "$MOBILE_UA" "$APP_URL/?release=${GITHUB_SHA}" || true)
            HEALTH=$(curl -fsS --max-time 25 "$APP_URL/api/health?release=${GITHUB_SHA}" || true)
            if grep -Fq "universal-core-mobile-v25" <<<"$MOBILE" \
              && grep -Fq "Pregunta lo que quieras" <<<"$MOBILE" \
              && ! grep -Fq "Mobile Recovery" <<<"$MOBILE" \
              && jq -e '.ok == true and .ready == true and .generativeReady == true and .capabilityKernel.schema == "universal-capability-kernel/v1" and (has("providers") | not) and (.continuity | has("provider") | not) and (.continuity | has("model") | not)' <<<"$HEALTH" >/dev/null 2>&1; then
              echo "Android Universal Core v27 release detected"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not expose the certified Android v27 release" >&2
          exit 1

      - name: Verify mobile root is canonical and interactive
        shell: bash
        run: |
          set -euo pipefail
          MOBILE=$(curl -fsS --max-time 30 -A "$MOBILE_UA" "$APP_URL/?mobile-cert=${GITHUB_SHA}")
          grep -Fq "universal-core-mobile-v25" <<<"$MOBILE"
          grep -Fq 'id="composer"' <<<"$MOBILE"
          grep -Fq 'id="input"' <<<"$MOBILE"
          grep -Fq "streamAvailable" <<<"$MOBILE"
          grep -Fq "streamEdge" <<<"$MOBILE"
          grep -Fq "currentController.abort('user_cancelled')" <<<"$MOBILE"
          grep -Fq "SpeechRecognition" <<<"$MOBILE"
          grep -Fq "speechSynthesis" <<<"$MOBILE"
          grep -Fq "FileReader" <<<"$MOBILE"
          grep -Fq "Regenerar" <<<"$MOBILE"
          grep -Fq "Copiar" <<<"$MOBILE"
          ! grep -Fqi "modo de continuidad" <<<"$MOBILE"
          ! grep -Fq "Mobile Recovery" <<<"$MOBILE"

      - name: Verify explicit mobile route matches canonical surface
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(curl -fsS --max-time 30 "$APP_URL/api/mobile?release=${GITHUB_SHA}")
          grep -Fq "universal-core-mobile-v25" <<<"$PAGE"
          grep -Fq "¿En qué trabajamos?" <<<"$PAGE"
          grep -Fq "Pregunta lo que quieras" <<<"$PAGE"

      - name: Verify server fallback remains genuinely generative and private
        shell: bash
        run: |
          set -euo pipefail
          ANSWER=''
          for attempt in $(seq 1 4); do
            ANSWER=$(curl -fsS --max-time 90 "$APP_URL/api/chat" \
              -H 'content-type: application/json' \
              -H "origin: $APP_URL" \
              --data '{"message":"Responde exactamente con la palabra OK.","mode":"general","sessionId":"mobile-production-v27"}' || true)
            if jq -e '.degraded == false and (.reply | type == "string") and (.reply | length) > 0 and .response.schema == "assistant-response/v1" and .capability_kernel == "universal-capability-kernel/v1" and (has("provider") | not) and (has("model") | not) and (has("fallbackFailures") | not) and (.response.metadata | has("provider") | not) and (.response.metadata | has("model") | not)' <<<"$ANSWER" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Server generative fallback or public privacy contract did not stabilize" >&2
          echo "$ANSWER" | jq '{degraded,reply,response_schema,capability_kernel}' >&2 || true
          exit 1
