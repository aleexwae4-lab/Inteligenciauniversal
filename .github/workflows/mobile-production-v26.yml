name: Mobile Production v26

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_URL: https://wae-inteligencia-universal.onrender.com
      MOBILE_UA: Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 Chrome/152.0.0.0 Mobile Safari/537.36
    steps:
      - name: Wait for v81 provider-health release on Render
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 54); do
            MOBILE=$(curl -fsS --max-time 25 -A "$MOBILE_UA" "$APP_URL/?release=${GITHUB_SHA}" || true)
            HEALTH=$(curl -fsS --max-time 25 "$APP_URL/api/health?release=${GITHUB_SHA}" || true)
            if grep -Fq "universal-core-mobile-v25" <<<"$MOBILE" \
              && grep -Fq "mobile-canonical-chat-v80.js?v=80" <<<"$MOBILE" \
              && grep -Fq "Pregunta lo que quieras" <<<"$MOBILE" \
              && ! grep -Fq "Mobile Recovery" <<<"$MOBILE" \
              && jq -e '.ok == true and .ready == true and .configuredGenerativeReady == true and .generativeReady == true and .providerHealth.version == "provider-health/v81" and (.providerHealth.eligibleProviderCount | tonumber) >= 1' <<<"$HEALTH" >/dev/null 2>&1; then
              echo "Android Universal Core v81 provider-health release detected"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not expose the certified v81 operational provider-health release" >&2
          exit 1

      - name: Verify mobile root is canonical and interactive
        shell: bash
        run: |
          set -euo pipefail
          MOBILE=$(curl -fsS --max-time 30 -A "$MOBILE_UA" "$APP_URL/?mobile-cert=${GITHUB_SHA}")
          grep -Fq "universal-core-mobile-v25" <<<"$MOBILE"
          grep -Fq "mobile-canonical-chat-v80.js?v=80" <<<"$MOBILE"
          grep -Fq 'id="composer"' <<<"$MOBILE"
          grep -Fq 'id="input"' <<<"$MOBILE"
          grep -Fq "streamAvailable" <<<"$MOBILE"
          grep -Fq "streamEdge" <<<"$MOBILE"
          grep -Fq "currentController.abort('user_cancelled')" <<<"$MOBILE"
          grep -Fq "SpeechRecognition" <<<"$MOBILE"
          grep -Fq "speechSynthesis" <<<"$MOBILE"
          grep -Fq "FileReader" <<<"$MOBILE"
          grep -Fq "Regenerar" <<<"$MOBILE"
          grep -Fq "Copiar" <<<"$MOBILE"
          ! grep -Fqi "modo de continuidad" <<<"$MOBILE"
          ! grep -Fq "Mobile Recovery" <<<"$MOBILE"

      - name: Verify explicit mobile route matches canonical surface
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(curl -fsS --max-time 30 "$APP_URL/api/mobile?release=${GITHUB_SHA}")
          grep -Fq "universal-core-mobile-v25" <<<"$PAGE"
          grep -Fq "¿En qué trabajamos?" <<<"$PAGE"
          grep -Fq "Pregunta lo que quieras" <<<"$PAGE"

      - name: Verify screenshot GPU question never collapses to incomplete-response UI
        shell: bash
        run: |
          set -euo pipefail
          ANSWER=''
          for attempt in $(seq 1 4); do
            ANSWER=$(curl -fsS --max-time 90 "$APP_URL/api/chat" \
              -H 'content-type: application/json' \
              -H "origin: $APP_URL" \
              --data '{"message":"Hola para que sirven los GPUs?","mode":"general","sessionId":"mobile-production-v83-gpu-screenshot"}' || true)
            if jq -e '(.reply | type == "string") and (.reply | length) >= 70 and .response.schema == "assistant-response/v1" and ((.degraded == false) or (.recovery.path == "focused-factual-v83"))' <<<"$ANSWER" >/dev/null 2>&1 \
              && grep -Eqi 'GPU|procesamiento gr[aá]fico|gr[aá]fic|c[oó]mputo paralelo' <<<"$(jq -r '.reply // ""' <<<"$ANSWER")" \
              && ! grep -Eqi 'respuesta no lleg[oó] completa|continuity_pass_through|all_models_unavailable|no pude completar|rutas generativas.*(saturad|no estuv)' <<<"$ANSWER"; then
              echo "Screenshot GPU question returned a useful visible answer"
              echo "$ANSWER" | jq '{degraded,reply,provider,model,recovery}'
              exit 0
            fi
            sleep 4
          done
          echo "Screenshot GPU question still collapses to an unusable response" >&2
          echo "$ANSWER" | jq '{degraded,reply,error,provider,model,recovery,response_schema:.response.schema}' >&2 || true
          exit 1

      - name: Verify Rayleigh recovery is concept-relevant and rejects Blue Sky title noise
        shell: bash
        run: |
          set -euo pipefail
          ANSWER=''
          for attempt in $(seq 1 4); do
            ANSWER=$(curl -fsS --max-time 90 "$APP_URL/api/chat" \
              -H 'content-type: application/json' \
              -H "origin: $APP_URL" \
              --data '{"message":"Explica en dos oraciones qué es la dispersión de Rayleigh y por qué hace que el cielo se vea azul.","mode":"general","sessionId":"mobile-production-v83-rayleigh-relevance"}' || true)
            REPLY=$(jq -r '.reply // ""' <<<"$ANSWER" 2>/dev/null || true)
            if jq -e '(.reply | type == "string") and (.reply | length) >= 70 and .response.schema == "assistant-response/v1" and ((.degraded == false) or (.recovery.path == "focused-factual-v83"))' <<<"$ANSWER" >/dev/null 2>&1 \
              && grep -Eqi 'Rayleigh' <<<"$REPLY" \
              && grep -Eqi 'dispers|luz|light|scattering|longitud de onda' <<<"$REPLY" \
              && ! grep -Eqi 'EL PUÑO DEL CIELO AZUL|Blue Sky \(Cielo Azul\)|metadatos por sí solos' <<<"$REPLY"; then
              echo "Rayleigh relevance recovery passed"
              echo "$ANSWER" | jq '{degraded,reply,provider,model,recovery}'
              exit 0
            fi
            sleep 4
          done
          echo "Rayleigh answer remained irrelevant or unusable" >&2
          echo "$ANSWER" | jq '{degraded,reply,error,provider,model,recovery,response_schema:.response.schema}' >&2 || true
          exit 1

      - name: Verify visible chat answers a real generative question
        shell: bash
        run: |
          set -euo pipefail
          ANSWER=''
          for attempt in $(seq 1 4); do
            ANSWER=$(curl -fsS --max-time 90 "$APP_URL/api/chat" \
              -H 'content-type: application/json' \
              -H "origin: $APP_URL" \
              --data '{"message":"Explica en dos oraciones qué es la dispersión de Rayleigh y por qué hace que el cielo se vea azul.","mode":"general","sessionId":"mobile-production-v81-real-answer"}' || true)
            if jq -e '.degraded == false and (.reply | type == "string") and (.reply | length) >= 80 and .response.schema == "assistant-response/v1"' <<<"$ANSWER" >/dev/null 2>&1 \
              && ! grep -Eqi 'continuity_pass_through|all_models_unavailable|no pude completar|rutas generativas.*(saturad|no estuv)|respuesta con evidencia recuperada' <<<"$ANSWER"; then
              echo "Real visible-chat generation passed"
              exit 0
            fi
            sleep 5
          done
          echo "Visible chat did not produce a real non-degraded answer" >&2
          echo "$ANSWER" | jq '{degraded,reply,error,provider,model,response_schema:.response.schema}' >&2 || true
          exit 1
