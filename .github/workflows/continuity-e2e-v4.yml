name: Continuity E2E v4

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP: https://wae-inteligencia-universal.onrender.com
    steps:
      - name: Verify Render health contract
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS --max-time 30 "$APP/api/health")
          jq -e '.ok == true and .service == "wae-universal-runtime" and .ready == true' <<<"$HEALTH" >/dev/null
          jq '{ok,version,ready,providers,memory,continuity}' <<<"$HEALTH"

      - name: Verify normal Render answer path
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n '{message:"Responde solamente con la palabra OK.",mode:"general",sessionId:"continuity-e2e-v4-auto",history:[],attachments:[],tools:[]}')
          RESULT=$(curl -fsS --max-time 90 "$APP/api/chat" -H 'content-type: application/json' --data-binary @- <<<"$PAYLOAD")
          jq -e '(.reply // "") | type == "string" and length > 0' <<<"$RESULT" >/dev/null
          jq -e '(.response_schema // .response.schema // "") == "assistant-response/v1"' <<<"$RESULT" >/dev/null
          jq '{provider,model,degraded,latencyMs,fallbackFailures,reply}' <<<"$RESULT"

      - name: Wait for continuity release marker
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            HEALTH=$(curl -fsS --max-time 20 "$APP/api/health" || true)
            if jq -e '.version == "1.3.0" and .continuity.configured == true and .continuity.provider == "universal_continuity_core"' <<<"$HEALTH" >/dev/null 2>&1; then
              jq '{version,continuity}' <<<"$HEALTH"
              exit 0
            fi
            sleep 5
          done
          echo 'continuity release marker not observed' >&2
          exit 1

      - name: Verify deterministic continuity lane
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n '{message:"Conserva esta solicitud durante una interrupción de proveedores.",mode:"general",provider:"continuity_core",sessionId:"continuity-e2e-v4-core",history:[],attachments:[{name:"estado.txt",type:"text/plain",text:"Estado de prueba: 4200 MXN"}],tools:[]}')
          RESULT=$(curl -fsS --max-time 30 "$APP/api/chat" -H 'content-type: application/json' --data-binary @- <<<"$PAYLOAD")
          jq -e '.provider == "universal_continuity_core" and .model == "deterministic-evidence-v1" and .degraded == true' <<<"$RESULT" >/dev/null
          jq -e '(.reply // "") | contains("4200 MXN")' <<<"$RESULT" >/dev/null
          jq -e '(.response.metadata.degraded // false) == true' <<<"$RESULT" >/dev/null
          jq '{provider,model,degraded,latencyMs,reply}' <<<"$RESULT"
