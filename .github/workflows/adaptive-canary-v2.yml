name: Universal Core Router v21 Canary

on:
  push:
    branches: [universal-core-router-v21-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  edge-canary:
    needs: router-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDGE_URL: https://pbswcbryxawsmltyromd.supabase.co/functions/v1/wae-local-voice-demo-v61
      ORIGIN: https://wae-inteligencia-universal.onrender.com
    steps:
      - name: Verify v21 fail-closed control plane
        shell: bash
        run: |
          set -euo pipefail
          CAP=$(curl -fsS --max-time 30 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data '{"action":"capabilities"}')
          jq -e '.success == true and .version == "1.8.0-universal-core-router-v21" and .router == "wae-adaptive-router-v21" and .canary_pct == 0 and .response_schema == "assistant-response/v1" and .adaptive_routing == true and .streaming_mode == "verified_only" and .ttft == "real_first_delta_only"' <<<"$CAP" >/dev/null
          echo "$CAP" | jq '{version,router,canary_pct,model_count,verified_streaming_models,streaming_mode,ttft}'

      - name: Bootstrap isolated v21 session
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          BOOT=$(curl -fsS --max-time 30 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data '{"action":"bootstrap"}')
          SID=$(jq -r '.session_id' <<<"$BOOT")
          SECRET=$(jq -r '.session_secret' <<<"$BOOT")
          test -n "$SID" && test "$SID" != null
          test -n "$SECRET" && test "$SECRET" != null
          echo "sid=$SID" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Prove default traffic remains control
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          PREVIEW=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"route_preview",session_id:$sid,session_secret:$secret,message:"Hola",mode:"general",stream:false}' | curl -fsS --max-time 30 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .router == "wae-adaptive-router-v21" and .router_variant == "control" and .task.path == "FAST" and (.candidates|length) > 0 and ([.candidates[]|select(.health == "offline" or .circuit == "OPEN")]|length) == 0' <<<"$PREVIEW" >/dev/null
          echo "$PREVIEW" | jq '{router_variant,task,candidates}'

      - name: Inspect forced candidate route safety
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          PREVIEW=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"route_preview",session_id:$sid,session_secret:$secret,message:"Hola",mode:"general",stream:false,routing_variant:"candidate"}' | curl -fsS --max-time 30 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .router_variant == "candidate" and .task.path == "FAST" and (.candidates|length) > 0 and ([.candidates[]|select(.health == "offline" or .circuit == "OPEN")]|length) == 0 and ([.candidates[]|select((.failure_debt|type)!="number")]|length) == 0' <<<"$PREVIEW" >/dev/null
          echo "$PREVIEW" | jq '{router_variant,task,requirements,candidates}'

      - name: Run paired control and candidate smoke samples
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          : > /tmp/router-v21.ndjson
          for variant in control candidate; do
            for i in 1 2 3 4 5; do
              CHAT=$(jq -n --arg sid "$SID" --arg secret "$SECRET" --arg variant "$variant" --arg msg "Router v21 $variant sample $i: responde solamente OK." '{action:"chat",session_id:$sid,session_secret:$secret,message:$msg,mode:"general",web_enabled:false,stream:false,routing_variant:$variant}' | curl -fsS --max-time 55 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @-)
              jq -e --arg variant "$variant" '.success == true and .runtime == "1.8.0-universal-core-router-v21" and .response_schema == "assistant-response/v1" and .router_variant == $variant and .ttft_ms == null and (.reply|type=="string") and (.reply|length)>0' <<<"$CHAT" >/dev/null
              jq -c '{request_id,provider,model,latency_ms,routing_path,router_variant,cost_microunits,degraded}' <<<"$CHAT" | tee -a /tmp/router-v21.ndjson
            done
          done
          echo '### Router v21 paired smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/router-v21.ndjson >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'Promotion remains HOLD: smoke samples are not the 30+30 evidence gate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify traces preserve control candidate separation
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          METRICS=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"metrics",session_id:$sid,session_secret:$secret,limit:20}' | curl -fsS --max-time 30 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and ([.traces[]|select(.router_variant=="control")]|length) >= 5 and ([.traces[]|select(.router_variant=="candidate")]|length) >= 5' <<<"$METRICS" >/dev/null
          echo "$METRICS" | jq '[.traces[]|{status,provider,model_name,total_latency_ms,router_variant,error_code}]'

      - name: Probe upstream streaming transports
        id: probe
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          PROBE=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"stream_probe",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 240 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .runtime == "1.8.0-universal-core-router-v21" and .router == "wae-adaptive-router-v21" and (.candidates_considered|type=="number")' <<<"$PROBE" >/dev/null
          VERIFIED=$(jq -r '.verified' <<<"$PROBE")
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "$PROBE" | jq .

      - name: Gate real SSE deltas
        if: steps.probe.outputs.verified == 'true'
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"chat",session_id:$sid,session_secret:$secret,message:"Explica en tres frases breves por qué medir TTFT mejora una interfaz.",mode:"general",web_enabled:false,stream:true,routing_variant:"candidate"}' > /tmp/request.json
          curl -fsS -N --max-time 90 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @/tmp/request.json > /tmp/stream.txt
          DELTAS=$(grep -c '^event: content.delta' /tmp/stream.txt || true)
          test "$DELTAS" -ge 2
          grep -q '^event: response.complete' /tmp/stream.txt
          ! grep -q '^event: response.error' /tmp/stream.txt
          COMPLETE=$(awk '/^event: response.complete/{getline; sub(/^data: /,""); print; exit}' /tmp/stream.txt)
          jq -e '.stream_verified == true and .runtime == "1.8.0-universal-core-router-v21" and .router_variant == "candidate" and (.ttft_ms|type=="number") and .ttft_ms > 0 and .ttft_ms < .latency_ms' <<<"$COMPLETE" >/dev/null
          echo "Verified progressive deltas: $DELTAS"

      - name: Keep progressive promotion on hold when no stream is verified
        if: steps.probe.outputs.verified != 'true'
        run: echo 'No provider produced verified upstream token deltas. Progressive streaming remains HOLD by design.'

      - name: Verify history contract after v21 probes
        shell: bash
        env:
          SID: ${{ steps.boot.outputs.sid }}
          SECRET: ${{ steps.boot.outputs.secret }}
        run: |
          set -euo pipefail
          LIST=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"list_conversations",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 30 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and (.conversations|length) >= 10' <<<"$LIST" >/dev/null
