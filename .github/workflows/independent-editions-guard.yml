name: Universal Core Independent Editions Guard
on:
  pull_request:
    paths:
      - 'server.js'
      - 'index.html'
      - 'ui/**'
      - 'test/dual-ui-variant-v120.test.js'
      - '.github/workflows/independent-editions-guard.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'index.html'
      - 'ui/**'
      - 'test/dual-ui-variant-v120.test.js'
      - '.github/workflows/independent-editions-guard.yml'
  workflow_dispatch:
jobs:
  editions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check runtime and edition contracts
        run: |
          node --check server.js
          node --check app.js
          node --check premium-v117.js
          node --test test/dual-ui-variant-v120.test.js test/ui-profile-isolation-v119.test.js test/premium-v117-hardening.test.js
