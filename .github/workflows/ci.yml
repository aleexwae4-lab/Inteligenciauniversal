name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://wae-inteligencia-universal.onrender.com
      EDGE_URL: https://pbswcbryxawsmltyromd.supabase.co/functions/v1/wae-local-voice-demo-v61
    steps:
      - name: Wait for Render release invariants
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            HEALTH=$(curl -fsS --max-time 20 "$APP_URL/api/health?release=${GITHUB_SHA}" || true)
            SW=$(curl -fsS --max-time 20 "$APP_URL/sw.js?release=${GITHUB_SHA}" || true)
            RUNTIME=$(curl -fsS --max-time 20 "$APP_URL/runtime-client.js?release=${GITHUB_SHA}" || true)
            SSE=$(curl -fsS --max-time 20 "$APP_URL/lib/sse-events.js?release=${GITHUB_SHA}" || true)
            if jq -e '.ok == true and .service == "wae-universal-runtime"' <<<"$HEALTH" >/dev/null 2>&1 \
              && grep -q "wae-universal-v" <<<"$SW" \
              && grep -q "routing_variant:'control'" <<<"$RUNTIME" \
              && grep -q "stream_continuity!==true" <<<"$RUNTIME" \
              && grep -q "createSSEParser" <<<"$SSE"; then
              echo "Render release invariants detected"
              jq '{version,ready,generativeReady,continuity}' <<<"$HEALTH"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not expose the required release invariants" >&2
          exit 1

      - name: Verify Render runtime health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS --max-time 30 "$APP_URL/api/health")
          jq -e '.ok == true and .ready == true' <<<"$HEALTH" >/dev/null

      - name: Verify v21 runtime and fail-closed control contract
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="$APP_URL"
          CAP=$(curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data '{"action":"capabilities"}')
          jq -e '.success == true and .version == "1.8.0-universal-core-router-v21" and .router == "wae-adaptive-router-v21" and .canary_pct == 0 and .response_schema == "assistant-response/v1" and .adaptive_routing == true and .streaming_mode == "verified_only" and .structured_responses == true and .natural_voice == true and .observability == true' <<<"$CAP" >/dev/null

          BOOT=$(curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data '{"action":"bootstrap"}')
          SID=$(jq -r '.session_id' <<<"$BOOT")
          SECRET=$(jq -r '.session_secret' <<<"$BOOT")
          test -n "$SID" && test "$SID" != "null"
          test -n "$SECRET" && test "$SECRET" != "null"
          echo "sid=$SID" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

          DEFAULT_PREVIEW=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"route_preview",session_id:$sid,session_secret:$secret,message:"Hola",mode:"general",stream:false}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .router_variant == "control" and .task.path == "FAST" and (.candidates|length) >= 1 and ([.candidates[] | select(.health == "offline" or .circuit == "OPEN")] | length) == 0' <<<"$DEFAULT_PREVIEW" >/dev/null

          CANDIDATE_PREVIEW=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"route_preview",session_id:$sid,session_secret:$secret,message:"Hola",mode:"general",stream:false,routing_variant:"candidate"}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .router_variant == "candidate" and (.candidates|length) >= 1 and ([.candidates[] | select(.health == "offline" or .circuit == "OPEN")] | length) == 0 and ([.candidates[] | select((.failure_debt|type)!="number")] | length) == 0' <<<"$CANDIDATE_PREVIEW" >/dev/null

          CHAT=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"chat",session_id:$sid,session_secret:$secret,message:"Responde solamente con la palabra OK.",mode:"general",web_enabled:false,stream:false}' | curl -fsS --max-time 55 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .runtime == "1.8.0-universal-core-router-v21" and .router_variant == "control" and .response.schema == "assistant-response/v1" and .ttft_ms == null and (.speech_text | type == "string") and (.speech_text | length > 0) and (.components | length > 0) and (.message_id | type == "string")' <<<"$CHAT" >/dev/null
          CID=$(jq -r '.conversation_id' <<<"$CHAT")

          LIST=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"list_conversations",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data-binary @-)
          jq -e '(.conversations | length) >= 1' <<<"$LIST" >/dev/null

          GET=$(jq -n --arg sid "$SID" --arg secret "$SECRET" --arg cid "$CID" '{action:"get_conversation",session_id:$sid,session_secret:$secret,conversation_id:$cid}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and (.messages | length) >= 2 and ([.messages[] | select(.role == "assistant" and .content_json.schema == "assistant-response/v1")] | length) >= 1' <<<"$GET" >/dev/null

          LEARN=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"learning_status",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $ORIGIN" --data-binary @-)
          jq -e '.success == true and .base_model_trained == false' <<<"$LEARN" >/dev/null

      - name: Verify SSE when available or fail closed when unavailable
        shell: bash
        env:
          SID: ${{ steps.runtime.outputs.sid }}
          SECRET: ${{ steps.runtime.outputs.secret }}
        run: |
          set -euo pipefail
          PROBE=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"stream_probe",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 240 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $APP_URL" --data-binary @-)
          jq -e '.success == true and .runtime == "1.8.0-universal-core-router-v21" and .router == "wae-adaptive-router-v21" and (.verified|type=="boolean")' <<<"$PROBE" >/dev/null
          VERIFIED=$(jq -r '.verified' <<<"$PROBE")
          if [ "$VERIFIED" != "true" ]; then
            echo "No SSE transport verified in this run; progressive client remains fail-closed by design."
            exit 0
          fi
          jq -e '([.results[] | select(.verified == true and (.deltas|tonumber) >= 1 and (.ttft_ms|type=="number") and .ttft_ms > 0)] | length) >= 1' <<<"$PROBE" >/dev/null

          jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"chat",session_id:$sid,session_secret:$secret,message:"Explica en tres frases breves por qué medir TTFT mejora la experiencia de una interfaz.",mode:"general",web_enabled:false,stream:true,routing_variant:"candidate"}' > /tmp/request.json
          curl -fsS -N --max-time 90 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $APP_URL" --data-binary @/tmp/request.json > /tmp/stream.txt
          DELTAS=$(grep -c '^event: content.delta' /tmp/stream.txt || true)
          test "$DELTAS" -ge 2
          grep -q '^event: response.complete' /tmp/stream.txt
          ! grep -q '^event: response.error' /tmp/stream.txt
          COMPLETE=$(awk '/^event: response.complete/{getline; sub(/^data: /,""); print; exit}' /tmp/stream.txt)
          jq -e '.success == true and .stream_verified == true and .runtime == "1.8.0-universal-core-router-v21" and .router_variant == "candidate" and .response_schema == "assistant-response/v1" and (.ttft_ms|type=="number") and .ttft_ms > 0 and .ttft_ms < .latency_ms' <<<"$COMPLETE" >/dev/null
          echo "Production SSE deltas: $DELTAS"
          jq '{provider,model,latency_ms,ttft_ms,router_overhead_ms,routing_path,router_variant}' <<<"$COMPLETE"
