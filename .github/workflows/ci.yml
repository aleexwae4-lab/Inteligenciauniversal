name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check Supabase adaptive runtime
        run: deno check supabase/functions/wae-local-voice-demo-v61/index.ts

  router-canary:
    if: github.ref == 'refs/heads/adaptive-router-streaming-v1'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDGE_URL: https://pbswcbryxawsmltyromd.supabase.co/functions/v1/wae-local-voice-demo-v61
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Benchmark adaptive router candidate vs control
        run: node scripts/router-canary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-router-canary-${{ github.sha }}
          path: router-canary-metrics.json
          if-no-files-found: ignore

  production-smoke:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Adaptive Router')
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://wae-inteligencia-universal.onrender.com
      EDGE_URL: https://pbswcbryxawsmltyromd.supabase.co/functions/v1/wae-local-voice-demo-v61
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Render release marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            if curl -fsS --max-time 20 "$APP_URL/sw.js?release=${GITHUB_SHA}" | grep -q "wae-universal-v11"; then
              echo "Render release marker detected"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not expose the expected release marker" >&2
          exit 1
      - name: Verify Render runtime health
        run: curl -fsS --max-time 30 "$APP_URL/api/health" | jq -e '.ok == true'
      - name: Verify adaptive streaming runtime
        run: node scripts/router-canary.mjs
      - name: Verify deployed client assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$APP_URL/index.html?sha=${GITHUB_SHA}" | grep -q "adaptive-streaming-client.js"
          curl -fsS --max-time 30 "$APP_URL/adaptive-streaming-client.js?sha=${GITHUB_SHA}" | grep -q "wae-adaptive-stream-client/1.0"
          curl -fsS --max-time 30 "$APP_URL/voice-streaming.js?sha=${GITHUB_SHA}" | grep -q "__waeVoiceStream"
