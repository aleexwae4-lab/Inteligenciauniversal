name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_URL: https://wae-inteligencia-universal.onrender.com
      EDGE_URL: https://pbswcbryxawsmltyromd.supabase.co/functions/v1/wae-local-voice-demo-v61
      EDGE_VERSION: 1.9.1-context-isolation-v55
      EDGE_ROUTER: wae-adaptive-router-v22
      EVAL_VERSION: supremacy-evaluation/v35
    steps:
      - name: Wait for exact Render release and generative readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 54); do
            HEALTH=$(curl -fsS --max-time 20 "$APP_URL/api/health?release=${GITHUB_SHA}" || true)
            CAPS=$(curl -fsS --max-time 20 "$APP_URL/api/capabilities?release=${GITHUB_SHA}" || true)
            EVALS=$(curl -fsS --max-time 20 "$APP_URL/api/evals?release=${GITHUB_SHA}" || true)
            INDEX=$(curl -fsS --max-time 20 "$APP_URL/?release=${GITHUB_SHA}" || true)
            if jq -e --arg eval "$EVAL_VERSION" --arg sha "$GITHUB_SHA" '.ok == true and .ready == true and .generativeReady == true and .service == "wae-universal-runtime" and .release.commit == $sha and .release.platform == "render" and .responseSchema == "assistant-response/v1" and .supremacy.evaluationPlane.version == $eval and .supremacy.evaluationPlane.blind == true and .supremacy.evaluationPlane.providerIdentityUsed == false' <<<"$HEALTH" >/dev/null 2>&1 \
              && jq -e --arg eval "$EVAL_VERSION" '.ready == true and .interface == "experience-v8-living-core" and .orchestration.schema == "universal-orchestrator/v1" and .orchestration.maxSpecialists == 3 and .evaluationPlane.version == $eval and .evaluationPlane.endpoint == "/api/evals" and .evaluationPlane.superiorityPolicy.claimRequiresEvidence == true' <<<"$CAPS" >/dev/null 2>&1 \
              && jq -e --arg eval "$EVAL_VERSION" '.success == true and .capabilities.version == $eval and .capabilities.blind == true and .capabilities.baseModelTraining == false and (.manifest.archetypes | length) >= 8' <<<"$EVALS" >/dev/null 2>&1 \
              && grep -Fq 'id="mobileSafeComposer"' <<<"$INDEX" \
              && grep -Fq '<script src="./progressive-boot-v23.js" defer></script>' <<<"$INDEX"; then
              echo "Exact Render release detected: $GITHUB_SHA"
              jq '{version,ready,generativeReady,release,providerHealth:{eligibleProviderCount,healthyProviderCount,preferredProvider}}' <<<"$HEALTH"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not expose the expected commit with generative readiness" >&2
          exit 1

      - name: Verify Render runtime health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS --max-time 30 "$APP_URL/api/health")
          jq -e --arg eval "$EVAL_VERSION" --arg sha "$GITHUB_SHA" '.ok == true and .ready == true and .generativeReady == true and .release.commit == $sha and .service == "wae-universal-runtime" and .supremacy.evaluationPlane.version == $eval' <<<"$HEALTH" >/dev/null

      - name: Verify Deep orchestration public contract
        shell: bash
        run: |
          set -euo pipefail
          DEEP=''
          for attempt in $(seq 1 5); do
            DEEP=$(curl -fsS --max-time 115 "$APP_URL/api/orchestrate" \
              -H 'content-type: application/json' \
              -H "origin: $APP_URL" \
              --data '{"message":"Responde exactamente con la palabra OK.","mode":"analysis","sessionId":"production-smoke-v100-2"}' || true)
            if jq -e '.deep == true and .orchestration.schema == "universal-orchestrator/v1" and .orchestration.synthesis == "executive" and (.orchestration.specialists | length) >= 1 and (.reply | type == "string") and (.reply | length) > 0 and (has("provider") | not) and (has("model") | not) and ((.response.metadata | has("provider")) | not) and ((.response.metadata | has("model")) | not)' <<<"$DEEP" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Deep orchestration contract did not stabilize" >&2
          exit 1

      - name: Verify v22 adaptive runtime contract
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          CAP=$(curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data '{"action":"capabilities"}')
          jq -e --arg version "$EDGE_VERSION" --arg router "$EDGE_ROUTER" '.success == true and .version == $version and .router == $router and .canary_pct == 25 and .response_schema == "assistant-response/v1" and .adaptive_routing == true and .streaming_mode == "verified_only" and .structured_responses == true and .natural_voice == true and .observability == true' <<<"$CAP" >/dev/null

          BOOT=$(curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data '{"action":"bootstrap"}')
          SID=$(jq -r '.session_id' <<<"$BOOT")
          SECRET=$(jq -r '.session_secret' <<<"$BOOT")
          test -n "$SID" && test "$SID" != "null"
          test -n "$SECRET" && test "$SECRET" != "null"
          echo "sid=$SID" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

          CONTROL_PREVIEW=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"route_preview",session_id:$sid,session_secret:$secret,message:"Hola",mode:"general",stream:false,routing_variant:"control"}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data-binary @-)
          jq -e '.success == true and .router_variant == "control" and .task.path == "FAST" and (.candidates|length) >= 1 and ([.candidates[] | select(.health == "offline" or .circuit == "OPEN")] | length) == 0' <<<"$CONTROL_PREVIEW" >/dev/null

          CANDIDATE_PREVIEW=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"route_preview",session_id:$sid,session_secret:$secret,message:"Hola",mode:"general",stream:false,routing_variant:"candidate"}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data-binary @-)
          jq -e '.success == true and .router_variant == "candidate" and (.candidates|length) >= 1 and ([.candidates[] | select(.health == "offline" or .circuit == "OPEN")] | length) == 0 and ([.candidates[] | select((.failure_debt|type)!="number")] | length) == 0' <<<"$CANDIDATE_PREVIEW" >/dev/null

          CHAT=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"chat",session_id:$sid,session_secret:$secret,message:"Responde solamente con la palabra OK.",mode:"general",web_enabled:false,stream:false,routing_variant:"control"}' | curl -fsS --max-time 55 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data-binary @-)
          jq -e --arg version "$EDGE_VERSION" '.success == true and .runtime == $version and .router_variant == "control" and .response.schema == "assistant-response/v1" and .ttft_ms == null and (.speech_text | type == "string") and (.speech_text | length > 0) and (.components | length > 0) and (.message_id | type == "string")' <<<"$CHAT" >/dev/null
          CID=$(jq -r '.conversation_id' <<<"$CHAT")

          LIST=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"list_conversations",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data-binary @-)
          jq -e '(.conversations | length) >= 1' <<<"$LIST" >/dev/null

          GET=$(jq -n --arg sid "$SID" --arg secret "$SECRET" --arg cid "$CID" '{action:"get_conversation",session_id:$sid,session_secret:$secret,conversation_id:$cid}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data-binary @-)
          jq -e '.success == true and (.messages | length) >= 2 and ([.messages[] | select(.role == "assistant" and .content_json.schema == "assistant-response/v1")] | length) >= 1' <<<"$GET" >/dev/null

          LEARN=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"learning_status",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 30 "$EDGE_URL" -H "content-type: application/json" -H "origin: $APP_URL" --data-binary @-)
          jq -e '.success == true and .base_model_trained == false' <<<"$LEARN" >/dev/null

      - name: Verify SSE when available or fail closed when unavailable
        shell: bash
        env:
          SID: ${{ steps.runtime.outputs.sid }}
          SECRET: ${{ steps.runtime.outputs.secret }}
        run: |
          set -euo pipefail
          PROBE=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"stream_probe",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 240 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $APP_URL" --data-binary @-)
          jq -e --arg version "$EDGE_VERSION" --arg router "$EDGE_ROUTER" '.success == true and .runtime == $version and .router == $router and (.verified|type=="boolean")' <<<"$PROBE" >/dev/null
          VERIFIED=$(jq -r '.verified' <<<"$PROBE")
          if [ "$VERIFIED" != "true" ]; then
            echo "No SSE transport verified in this run; progressive client remains fail-closed by design."
            exit 0
          fi
          jq -e '([.results[] | select(.verified == true and (.deltas|tonumber) >= 1 and (.ttft_ms|type=="number") and .ttft_ms > 0)] | length) >= 1' <<<"$PROBE" >/dev/null

          jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"chat",session_id:$sid,session_secret:$secret,message:"Explica en tres frases breves por qué medir TTFT mejora la experiencia de una interfaz.",mode:"general",web_enabled:false,stream:true,routing_variant:"candidate"}' > /tmp/request.json
          STREAM_OK=0
          for attempt in 1 2 3; do
            : > /tmp/stream.txt
            curl -fsS -N --max-time 90 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $APP_URL" --data-binary @/tmp/request.json > /tmp/stream.txt || true
            DELTAS=$(grep -c '^event: content.delta' /tmp/stream.txt || true)
            COMPLETE=$(awk '/^event: response.complete/{getline; sub(/^data: /,""); print; exit}' /tmp/stream.txt)
            if [ "$DELTAS" -ge 2 ] \
              && grep -q '^event: response.complete' /tmp/stream.txt \
              && ! grep -q '^event: response.error' /tmp/stream.txt \
              && jq -e --arg version "$EDGE_VERSION" '.success == true and .stream_verified == true and .runtime == $version and .router_variant == "candidate" and .response_schema == "assistant-response/v1" and (.ttft_ms|type=="number") and .ttft_ms > 0 and .ttft_ms < .latency_ms' <<<"$COMPLETE" >/dev/null 2>&1; then
              echo "Verified progressive SSE on attempt $attempt with $DELTAS deltas"
              STREAM_OK=1
              break
            fi
            sleep 2
          done
          if [ "$STREAM_OK" = "1" ]; then
            exit 0
          fi

          REPROBE=$(jq -n --arg sid "$SID" --arg secret "$SECRET" '{action:"stream_probe",session_id:$sid,session_secret:$secret}' | curl -fsS --max-time 240 "$EDGE_URL" -H 'content-type: application/json' -H "origin: $APP_URL" --data-binary @-)
          jq -e --arg version "$EDGE_VERSION" --arg router "$EDGE_ROUTER" '.success == true and .runtime == $version and .router == $router and (.verified|type=="boolean")' <<<"$REPROBE" >/dev/null
          if [ "$(jq -r '.verified' <<<"$REPROBE")" != "true" ]; then
            echo "SSE transport became unavailable after the initial probe; progressive streaming remains fail-closed by design."
            exit 0
          fi
          echo "A verified SSE transport remained available, but three real candidate streams failed." >&2
          exit 1
